{% extends "base.html" %} {% from "_macros.html" import csrf %} {% block title
%}Register{% endblock %} {% block content %}
<h1>Create an account</h1>
<form method="post" class="stack narrow">
  {{ csrf() }}
  <label
    >Your name <input name="name" value="{{ name }}" required autofocus
  /></label>
  <label
    >Email <input type="email" name="email" value="{{ email }}" required
  /></label>
  <label
    >Password (at least 8 characters)
    <input type="password" name="password" minlength="8" required
  /></label>
  <label
    >Confirm password
    <input type="password" name="confirm" minlength="8" required
  /></label>
  <button class="btn primary">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
